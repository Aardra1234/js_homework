<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio</title>
</head>
<body>
    <script>
        var userProfile = {
    username: " CoolUser99 ",
    bio: " I LOVE coding! JavaScript is Great!!! "
    };

    function cleanUserBio(profile) {
        var username = profile.username.trim().toLowerCase();
        var bio = profile.bio.trim().toLowerCase();

        bio = bio.replace("javascript", "JS");
        var bioLength = bio.length;

        return {
        username: username,
        bio: bio,
        bioLength: bioLength
        };
    };
    
    var result = cleanUserBio(userProfile);
    console.log("Username: "+ result.username);
    console.log("bio: "+ result.bio);
    console.log("biolength: "+ result.bioLength);
    </script>
</body>
</html>
