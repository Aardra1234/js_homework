<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Manager</title>
</head>
<body>
    <script>
        let contact1={
            name : "Anna",
            phone : "9876543210",
            email : "anna@gmail.com",
            getInfo: function() { return " Name : " + this.name + "\n Phone: " + this.phone + "\n Email: " + this.email;}
        };

        function printContactInfo(contact) { console.log(contact.getInfo()); }

        let contact2={
            name : "Sandra",
            phone : "9998765443",
            email : "sandra@gmail.com",
            getInfo: function() { return " Name : " + this.name + "\n Phone: " + this.phone + "\n Email: " + this.email;}
        };

        printContactInfo(contact1); 
        printContactInfo(contact2);
    </script>
</body>
</html>
