<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guessing Game</title>
</head>
<body>
    <script>
        var i = 0;

        while(i < 5) {

            var number = parseInt(prompt("Enter a value between 1 to 5: "));

            if(number < 1 || number > 5) {
                console.log("Invalid input");
                continue;
            }

            i++;

            switch(number) {

                case 1:
                    number = "one";
                    break;

                case 2:
                    number = "two";
                    break;

                case 3:
                    number = "three";
                    break;

                case 4:
                    number = "four";
                    break;

                case 5:
                    number = "five";
                    break;
            }

            if(number == "three") {
                console.log("You guessed it right!");
                break;
            }
            else {
                console.log("Wrong guess. Try again.");
            }
        }

        if(i == 5) {
            console.log("Game over");
        }

    </script>

</body>
</html>
